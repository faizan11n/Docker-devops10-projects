services:
  mongodb:
    image: mongo:7
    container_name: mongo-server
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: demouser
      MONGO_INITDB_ROOT_PASSWORD: demopass123
    volumes:
      - mongo_data:/data/db
    networks:
      - db-net


  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-url
    restart: always
    ports:
      - "8087:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: demouser
      ME_CONFIG_MONGODB_ADMINPASSWORD: demopass123
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    networks:
      - db-net


networks:
  db-net:
    driver: bridge


volumes:
  mongo_data:
